name: Release

# Cutting a release: push a commit to main whose message contains the
# marker "[release]". The tag (vX.Y.Z) and the release are derived from
# the project() VERSION in the root CMakeLists, so the version has a
# single source of truth. Builds run on all three platforms and upload
# their archives to the release via the uploads REST API (no gh needed
# inside the build jobs).

on:
  push:
    branches: [main]
  # Manual re-runs from the Actions tab (useful when a build job lost
  # its runner, e.g. a macOS arm64 pool blip). The [release] guard is
  # bypassed for dispatch: the "Create release" job tolerates an
  # existing release and asset uploads clobber, so re-runs are safe.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create release
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v5

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -n1 | awk '{print $2}')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<EOF
          ## Verified accuracy

          | Suite | Result |
          |---|---|
          | blargg cpu_instrs (01-11) | 11/11 pass |
          | blargg instr_timing | pass (M-cycle-exact instruction timing) |
          | dmg-acid2 | pixel-perfect (0/23040 pixels differ) |
          | cgb-acid2 | pixel-perfect (0/23040 pixels differ, exact RGB) |
          | Unit checks (CTest) | 99/99 |

          ## Downloads

          | Asset | Platform | Requirements |
          |---|---|---|
          | GameBoyEmulator-${TAG}-Windows-x64.zip | Windows 10/11 x64 | none; SDL2.dll included |
          | GameBoyEmulator-${TAG}-Linux-x64.tar.gz | Linux x86-64, glibc 2.35 or newer | SDL2 runtime (sudo apt install libsdl2-2.0-0 or the distro equivalent) |
          | GameBoyEmulator-${TAG}-macOS-arm64.tar.gz | macOS 14+ on Apple Silicon | brew install sdl2 |
          | GameBoyEmulator-${TAG}-macOS-x64.tar.gz | macOS 14+ on Intel | brew install sdl2 |

          ## New in 3.0.0: full Game Boy Color support

          - CGB hardware model: color palettes (8 BG + 8 OBJ, RGB555),
            VRAM banking with BG map attributes (flips, banks,
            priority), WRAM banking, HBlank/general-purpose DMA to
            VRAM, and double-speed CPU via KEY1 + STOP
          - Correct CGB BG/OBJ priority rules and OAM-index sprite
            priority (DMG-style X priority via OPRI)
          - STOP now freezes DIV on both models; CGB speed switch
            emulated with the ~2050 M-cycle hardware pause
          - cgb-acid2 rendered pixel-perfect; DMG accuracy (blargg
            11/11, dmg-acid2 pixel-perfect) fully preserved
          - Save states v3 (CGB register file, palettes, HDMA, speed);
            --dmg flag forces monochrome mode for any ROM

          Full changelog: CHANGELOG.md in the repository.

          ## Usage

              gameboy <rom.gb>               DMG game, windowed; F5/F8 states, Tab turbo
              gameboy <rom.gbc>              Game Boy Color game
              gameboy <rom.gbc> --dmg        force monochrome mode
              gameboy <rom.gb> --scale 3     window scale 1-8
              gameboy <rom.gb> --headless N   run N frames without a window
          EOF
          # Idempotent: a re-run with the same version reuses the
          # existing release instead of failing on the duplicate tag.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "GameBoy Emulator $TAG" \
              --notes-file notes.md
          fi
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x64
    needs: release
    runs-on: ubuntu-latest
    # Ubuntu 22.04 container: glibc 2.35, so the binary runs on any
    # mainstream distro from 22.04 onward. libstdc++/libgcc are linked
    # statically to remove any GCC runtime version dependency.
    container: ubuntu:22.04
    env:
      TAG: ${{ needs.release.outputs.tag }}
      RELEASE_ID: ${{ needs.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libsdl2-dev curl ca-certificates jq

      - name: Build
        # Container steps run under sh (dash) by default; this step
        # uses bash-only pipefail/PIPESTATUS, so request bash explicitly.
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            2>&1 | tee configure.log
          cfg=${PIPESTATUS[0]}
          if [ "$cfg" -ne 0 ]; then
            tail -20 configure.log | while IFS= read -r line; do
              printf '::error::%s\n' "${line:0:180}"
            done
            exit "$cfg"
          fi
          cmake --build build -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE 'error|fatal' build.log | sort -u | head -30 | while IFS= read -r line; do
              printf '::error::%s\n' "${line:0:180}"
            done
          fi
          exit "$rc"

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            cp README.md build/
            ASSET="GameBoyEmulator-${TAG}-Linux-x64.tar.gz"
            tar -czf "$ASSET" -C build gameboy README.md
            # Clobber: delete an existing asset of the same name first,
            # then upload. Pure REST via curl + jq (no gh in the
            # container; this is the path that already worked here).
            AID=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              | jq -r ".[] | select(.name == \"$ASSET\") | .id")
            if [ -n "$AID" ]; then
              curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$AID"
            fi
            curl -sf --retry 3 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$ASSET" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ASSET}"
          } 2>&1 | tee package.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            cat package.log | while IFS= read -r line; do
              printf '::error::%s\n' "${line:0:180}"
            done
          fi
          exit "$rc"

  windows:
    name: Build Windows x64
    needs: release
    runs-on: windows-latest
    env:
      SDL2_VERSION: "2.32.10"
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch SDL2 development libraries
        shell: pwsh
        run: |
          curl.exe -L -o sdl2.zip "https://github.com/libsdl-org/SDL/releases/download/release-$($env:SDL2_VERSION)/SDL2-devel-$($env:SDL2_VERSION)-VC.zip"
          Expand-Archive sdl2.zip -DestinationPath sdl2
          "SDL2_PREFIX=$PWD/sdl2/SDL2-$($env:SDL2_VERSION)" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:SDL2_PREFIX"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 30 | ForEach-Object {
              Write-Host "::error::$($_.Line.Substring(0, [Math]::Min(180, $_.Line.Length)))"
            }
            exit $LASTEXITCODE
          }

      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Visual Studio multi-config generator appends /Release to
          # the runtime output directory; fall back to build/ just in case.
          $bin = "build/Release"
          if (-not (Test-Path "$bin/gameboy.exe")) { $bin = "build" }
          if (-not (Test-Path "$bin/gameboy.exe") -or -not (Test-Path "$bin/SDL2.dll")) {
            Write-Host "::error::gameboy.exe or SDL2.dll not found in build/Release or build/"
            exit 1
          }
          $asset = "GameBoyEmulator-$($env:TAG)-Windows-x64.zip"
          Compress-Archive -Path "$bin/gameboy.exe", "$bin/SDL2.dll", README.md -DestinationPath $asset -ErrorAction Stop
          # --clobber replaces an existing asset, so re-runs are safe
          gh release upload $env:TAG $asset --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    name: Build macOS ${{ matrix.suffix }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            suffix: arm64
          - runner: macos-26-intel
            suffix: x64
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install sdl2

      - name: Build
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp README.md build/
          ASSET="GameBoyEmulator-${TAG}-macOS-${{ matrix.suffix }}.tar.gz"
          tar -czf "$ASSET" -C build gameboy README.md
          # --clobber replaces an existing asset, so re-runs are safe
          gh release upload "$TAG" "$ASSET" --clobber
